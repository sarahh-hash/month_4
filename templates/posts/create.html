{% extends 'posts/base.html' %}

{% block title %}Создать пост{% endblock %}

{% block content %}
<h1>Создать пост</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Создать пост
    </button>
</form>

<a href="{% url 'create_category' %}" class="btn btn-secondary mt-3">
    Добавить категорию
</a>
{% endblock %}
